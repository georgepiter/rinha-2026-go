services:
  api1:
    image: ghcr.io/georgepiter/rinha-2026-go:latest
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: '160MB'
    networks:
      - rinha-network

  api2:
    image: ghcr.io/georgepiter/rinha-2026-go:latest
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: '160MB'
    networks:
      - rinha-network

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: '30MB'
    networks:
      - rinha-network

networks:
  rinha-network:
    driver: bridge
